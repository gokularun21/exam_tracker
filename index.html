<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE CS Complete Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Smooth transition style for dropdown expanding */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .accordion-active .accordion-content {
            max-height: 1000px;
            transition: max-height 0.5s ease-in;
        }
        .rotate-icon {
            transition: transform 0.3s ease;
        }
        .accordion-active .rotate-icon {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-indigo-400">⚡ GATE CS MASTER TRACKER</h1>
            <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-3 py-1 rounded-full font-mono">Status: Interactive Preparation</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            
            <div class="lg:col-span-2 space-y-6">
                <section class="bg-gray-950 border border-gray-800 rounded-2xl p-6">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-xl font-bold text-white flex items-center gap-2">
                            <span>✅</span> Official IIT Syllabus Checklist
                        </h2>
                        <span id="stat-syllabus-progress" class="text-2xl font-extrabold text-indigo-400 font-mono">0%</span>
                    </div>
                    
                    <div class="w-full bg-gray-800 rounded-full h-2 mb-6">
                        <div id="progress-bar-fill" class="bg-indigo-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    
                    <div class="space-y-3" id="checklist-container">
                        
                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>1. Engineering Mathematics & Discrete Math</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-1" class="mt-0.5 accent-indigo-500 rounded"> Propositional and first-order logic</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-2" class="mt-0.5 accent-indigo-500 rounded"> Sets, relations, functions, partial orders & lattices</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-3" class="mt-0.5 accent-indigo-500 rounded"> Monoids & Groups</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-4" class="mt-0.5 accent-indigo-500 rounded"> Graphs: connectivity, matching, colouring</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-5" class="mt-0.5 accent-indigo-500 rounded"> Combinatorics: counting, recurrence relations, generating functions</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-6" class="mt-0.5 accent-indigo-500 rounded"> Linear Algebra: Matrices, determinants, system of linear equations</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-7" class="mt-0.5 accent-indigo-500 rounded"> Eigenvalues/eigenvectors & LU decomposition</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-8" class="mt-0.5 accent-indigo-500 rounded"> Calculus: Limits, continuity, differentiability, maxima/minima, mean value theorem, integration</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-9" class="mt-0.5 accent-indigo-500 rounded"> Probability: Random variables (Uniform, normal, exponential, Poisson, binomial)</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="em-10" class="mt-0.5 accent-indigo-500 rounded"> Mean, median, mode, std deviation, conditional probability & Bayes theorem</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>2. Digital Logic</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="dl-1" class="mt-0.5 accent-indigo-500 rounded"> Boolean algebra</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="dl-2" class="mt-0.5 accent-indigo-500 rounded"> Minimization of functions</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="dl-3" class="mt-0.5 accent-indigo-500 rounded"> Combinational circuits</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="dl-4" class="mt-0.5 accent-indigo-500 rounded"> Sequential circuits</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="dl-5" class="mt-0.5 accent-indigo-500 rounded"> Number representations & computer arithmetic (fixed & floating point)</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>3. Computer Organization and Architecture</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="coa-1" class="mt-0.5 accent-indigo-500 rounded"> Machine instructions and addressing modes</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="coa-2" class="mt-0.5 accent-indigo-500 rounded"> ALU, data path and control unit</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="coa-3" class="mt-0.5 accent-indigo-500 rounded"> Instruction pipelining and Pipeline hazards</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="coa-4" class="mt-0.5 accent-indigo-500 rounded"> Memory hierarchy: cache, main memory and secondary storage</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="coa-5" class="mt-0.5 accent-indigo-500 rounded"> I/O interface (interrupt and DMA mode)</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>4. Programming and Data Structures</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="pds-1" class="mt-0.5 accent-indigo-500 rounded"> Programming in C</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="pds-2" class="mt-0.5 accent-indigo-500 rounded"> Recursion</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="pds-3" class="mt-0.5 accent-indigo-500 rounded"> Arrays, stacks, queues, linked lists</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="pds-4" class="mt-0.5 accent-indigo-500 rounded"> Trees, Binary Search Trees, Binary Heaps</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="pds-5" class="mt-0.5 accent-indigo-500 rounded"> Graphs</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>5. Algorithms</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="algo-1" class="mt-0.5 accent-indigo-500 rounded"> Searching, sorting, hashing</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="algo-2" class="mt-0.5 accent-indigo-500 rounded"> Asymptotic worst case time and space complexity</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="algo-3" class="mt-0.5 accent-indigo-500 rounded"> Algorithm design techniques: Greedy method</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="algo-4" class="mt-0.5 accent-indigo-500 rounded"> Algorithm design techniques: Dynamic Programming</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="algo-5" class="mt-0.5 accent-indigo-500 rounded"> Algorithm design techniques: Divide-and-conquer</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="algo-6" class="mt-0.5 accent-indigo-500 rounded"> Graph traversals, minimum spanning trees, shortest paths</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>6. Theory of Computation</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="toc-1" class="mt-0.5 accent-indigo-500 rounded"> Regular expressions and finite automata</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="toc-2" class="mt-0.5 accent-indigo-500 rounded"> Context-free grammars and push-down automata</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="toc-3" class="mt-0.5 accent-indigo-500 rounded"> Regular and context-free languages, pumping lemma</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="toc-4" class="mt-0.5 accent-indigo-500 rounded"> Turing machines and undecidability</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>7. Compiler Design</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cd-1" class="mt-0.5 accent-indigo-500 rounded"> Lexical analysis</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cd-2" class="mt-0.5 accent-indigo-500 rounded"> Parsing, Syntax-Directed Translation</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cd-3" class="mt-0.5 accent-indigo-500 rounded"> Runtime environments</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cd-4" class="mt-0.5 accent-indigo-500 rounded"> Intermediate code generation</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cd-5" class="mt-0.5 accent-indigo-500 rounded"> Local optimization</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cd-6" class="mt-0.5 accent-indigo-500 rounded"> Data flow analysis: constant propagation, liveness analysis, common subexpression elimination</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>8. Operating Systems</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="os-1" class="mt-0.5 accent-indigo-500 rounded"> System calls, processes, threads</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="os-2" class="mt-0.5 accent-indigo-500 rounded"> Inter-process communication, concurrency and synchronization</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="os-3" class="mt-0.5 accent-indigo-500 rounded"> Deadlock</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="os-4" class="mt-0.5 accent-indigo-500 rounded"> CPU and I/O scheduling</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="os-5" class="mt-0.5 accent-indigo-500 rounded"> Memory management and virtual memory</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="os-6" class="mt-0.5 accent-indigo-500 rounded"> File systems</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>9. Databases (DBMS)</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="db-1" class="mt-0.5 accent-indigo-500 rounded"> ER-model</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="db-2" class="mt-0.5 accent-indigo-500 rounded"> Relational model: relational algebra, tuple calculus</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="db-3" class="mt-0.5 accent-indigo-500 rounded"> SQL queries</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="db-4" class="mt-0.5 accent-indigo-500 rounded"> Integrity constraints, Normal forms</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="db-5" class="mt-0.5 accent-indigo-500 rounded"> File organization, Indexing (e.g., B and B+ trees)</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="db-6" class="mt-0.5 accent-indigo-500 rounded"> Transactions and concurrency control</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-indigo-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>10. Computer Networks</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cn-1" class="mt-0.5 accent-indigo-500 rounded"> Concept of Layering: OSI and TCP/IP Protocol Stacks</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cn-2" class="mt-0.5 accent-indigo-500 rounded"> Basics of packet, circuit, and virtual circuit switching</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cn-3" class="mt-0.5 accent-indigo-500 rounded"> Data Link Layer: Framing, error detection, Medium Access Control, Ethernet bridging</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cn-4" class="mt-0.5 accent-indigo-500 rounded"> Routing Protocols: Shortest path, flooding, distance vector & link state routing</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cn-5" class="mt-0.5 accent-indigo-500 rounded"> Fragmentation and IP addressing, IPv4, CIDR notation</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cn-6" class="mt-0.5 accent-indigo-500 rounded"> Basics of IP support protocols (ARP, DHCP, ICMP), NAT</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cn-7" class="mt-0.5 accent-indigo-500 rounded"> Transport Layer: Flow control and congestion control, UDP, TCP, sockets</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="cn-8" class="mt-0.5 accent-indigo-500 rounded"> Application Layer Protocols: DNS, SMTP, HTTP, FTP, Email</label>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-item border border-gray-800 rounded-xl bg-gray-900/10 overflow-hidden">
                            <button class="accordion-header w-full flex justify-between items-center p-4 bg-gray-900/40 hover:bg-gray-900/60 transition-colors text-left font-semibold text-emerald-400 text-sm tracking-wide cursor-pointer uppercase">
                                <span>General Aptitude</span>
                                <svg class="rotate-icon w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            <div class="accordion-content">
                                <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-300 border-t border-gray-800 bg-gray-950/40">
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="ga-1" class="mt-0.5 accent-emerald-500 rounded"> Verbal Aptitude: Basic English grammar, vocabulary, reading/comprehension, narrative sequencing</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="ga-2" class="mt-0.5 accent-emerald-500 rounded"> Quantitative Aptitude: Ratios, percentages, powers, exponents, logarithms, series, permutations/combinations, mensuration, geometry, elementary statistics & probability</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="ga-3" class="mt-0.5 accent-emerald-500 rounded"> Analytical Aptitude: Logic, pattern recognition, number/alphanumeric series, syllogisms, analogies</label>
                                    <label class="flex items-start gap-2 cursor-pointer"><input type="checkbox" data-id="ga-4" class="mt-0.5 accent-emerald-500 rounded"> Spatial Aptitude: Translation, rotation, scaling, mirroring, assembling, grouping, paper folding/cutting</label>
                                </div>
                            </div>
                        </div>

                    </div>
                </section>
            </div>

            <div class="space-y-6 lg:sticky lg:top-24">
                
                <section class="bg-gradient-to-br from-indigo-950 to-slate-900 border border-indigo-500/30 rounded-2xl p-5 text-center shadow-xl">
                    <h2 class="text-xs font-semibold uppercase tracking-widest text-indigo-300 mb-3">Countdown to Next GATE</h2>
                    <div class="grid grid-cols-4 gap-1.5 font-mono text-center">
                        <div class="bg-gray-950/80 p-2 rounded-lg border border-gray-800">
                            <div id="days" class="text-2xl font-extrabold text-white">00</div>
                            <div class="text-[9px] text-gray-400 uppercase mt-0.5">Days</div>
                        </div>
                        <div class="bg-gray-950/80 p-2 rounded-lg border border-gray-800">
                            <div id="hours" class="text-2xl font-extrabold text-white">00</div>
                            <div class="text-[9px] text-gray-400 uppercase mt-0.5">Hours</div>
                        </div>
                        <div class="bg-gray-950/80 p-2 rounded-lg border border-gray-800">
                            <div id="minutes" class="text-2xl font-extrabold text-white">00</div>
                            <div class="text-[9px] text-gray-400 uppercase mt-0.5">Mins</div>
                        </div>
                        <div class="bg-gray-950/80 p-2 rounded-lg border border-gray-800">
                            <div id="seconds" class="text-2xl font-extrabold text-emerald-400">00</div>
                            <div class="text-[9px] text-gray-400 uppercase mt-0.5">Secs</div>
                        </div>
                    </div>
                </section>

                <section class="bg-gray-950 border border-gray-800 rounded-2xl p-5">
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                        <div class="text-xs text-gray-400 uppercase font-medium">Total Study Hours Invested</div>
                        <div id="stat-total-hours" class="text-3xl font-extrabold text-white mt-1">0 hrs</div>
                    </div>
                </section>

                <section class="bg-gray-950 border border-gray-800 rounded-2xl p-5">
                    <h2 class="text-md font-bold text-white mb-3 flex items-center gap-2">
                        <span>📅</span> Log Study Hours
                    </h2>
                    <form id="study-form" class="space-y-3 mb-4">
                        <input type="date" id="study-date" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white">
                        <input type="number" id="study-hours" step="0.5" min="0" max="24" placeholder="Hours studied (e.g. 6.5)" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-white">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2 rounded-lg transition-colors cursor-pointer">Log Work</button>
                    </form>
                    
                    <div class="max-h-48 overflow-y-auto pr-1">
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="border-b border-gray-800 text-gray-400 sticky top-0 bg-gray-950 pb-1">
                                    <th class="pb-1 font-medium">Date</th>
                                    <th class="pb-1 font-medium text-right">Time</th>
                                </tr>
                            </thead>
                            <tbody id="hours-table-body" class="divide-y divide-gray-800/50">
                                </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script>
        // 1. EXAM COUNTDOWN
        // Configured for typical February exam cycle targeting early Saturday window
        const TARGET_DATE = new Date("February 6, 2027 09:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = TARGET_DATE - now;

            if (difference < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / (1000));

            document.getElementById("days").innerText = String(d).padStart(2, '0');
            document.getElementById("hours").innerText = String(h).padStart(2, '0');
            document.getElementById("minutes").innerText = String(m).padStart(2, '0');
            document.getElementById("seconds").innerText = String(s).padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 2. ACCORDION OPEN/CLOSE INTERACTION
        const accordionHeaders = document.querySelectorAll('.accordion-header');
        accordionHeaders.forEach(header => {
            header.addEventListener('click', () => {
                const item = header.parentElement;
                item.classList.toggle('accordion-active');
            });
        });

        // 3. PERSISTED REPOSITORY STORAGE MANAGEMENT (Local browser sandbox)
        let studyLogs = JSON.parse(localStorage.getItem('gate_deep_logs')) || [];
        let checkedItems = JSON.parse(localStorage.getItem('gate_deep_checked')) || [];

        const studyForm = document.getElementById('study-form');
        const hoursTableBody = document.getElementById('hours-table-body');
        const statTotalHours = document.getElementById('stat-total-hours');
        const statSyllabusProgress = document.getElementById('stat-syllabus-progress');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const checkboxes = document.querySelectorAll('#checklist-container input[type="checkbox"]');

        document.getElementById('study-date').valueAsDate = new Date();

        function renderLogs() {
            hoursTableBody.innerHTML = '';
            let totalHours = 0;
            studyLogs.sort((a, b) => new Date(b.date) - new Date(a.date));

            studyLogs.forEach(log => {
                totalHours += parseFloat(log.hours);
                const row = document.createElement('tr');
                row.className = "text-gray-400 border-b border-gray-900/40";
                row.innerHTML = `
                    <td class="py-2 font-mono">${new Date(log.date).toLocaleDateString('en-IN', {day: 'numeric', month: 'short'})}</td>
                    <td class="py-2 text-right font-semibold text-white">${log.hours} hrs</td>
                `;
                hoursTableBody.appendChild(row);
            });
            statTotalHours.innerText = `${totalHours} hrs`;
        }

        studyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('study-date').value;
            const hours = document.getElementById('study-hours').value;

            studyLogs.push({ date, hours });
            localStorage.setItem('gate_deep_logs', JSON.stringify(studyLogs));
            renderLogs();
            document.getElementById('study-hours').value = '';
        });

        // 4. SYLLABUS CALCULATION LOGIC
        function updateSyllabusStats() {
            const totalItems = checkboxes.length;
            const currentCheckedCount = document.querySelectorAll('#checklist-container input[type="checkbox"]:checked').length;
            const percentage = totalItems > 0 ? Math.round((currentCheckedCount / totalItems) * 100) : 0;
            
            statSyllabusProgress.innerText = `${percentage}%`;
            progressBarFill.style.width = `${percentage}%`;
        }

        checkboxes.forEach(box => {
            const id = box.getAttribute('data-id');
            if (checkedItems.includes(id)) box.checked = true;

            box.addEventListener('change', () => {
                const currentId = box.getAttribute('data-id');
                if (box.checked) {
                    if (!checkedItems.includes(currentId)) checkedItems.push(currentId);
                } else {
                    checkedItems = checkedItems.filter(item => item !== currentId);
                }
                localStorage.setItem('gate_deep_checked', JSON.stringify(checkedItems));
                updateSyllabusStats();
            });
        });

        // Bootstrap Initial UI Layout state on render
        renderLogs();
        updateSyllabusStats();
    </script>
</body>
</html>
